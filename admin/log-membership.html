<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log membership · Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="page page-narrow">
      <div class="page-header">
        <div>
          <h1>Log a membership</h1>
          <p>Record a membership purchase or renewal.</p>
        </div>
      </div>

      <div class="card">
        <form id="form" class="form">
          <div class="field">
            <label class="label" for="owner-type">Owner</label>
            <select class="select" id="owner-type" required>
              <option value="student">An individual student</option>
              <option value="family">A family group</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="owner-id-student">Whose membership?</label>
            <input
              class="input"
              id="owner-id-student"
              list="owner-student-list"
              placeholder="Type student name or email…"
              autocomplete="off"
            />
            <select class="select" id="owner-id-family" hidden></select>
            <datalist id="owner-student-list"></datalist>
          </div>
          <div class="field">
            <label class="label" for="tier">Tier</label>
            <input class="input" id="tier" list="tier-list" placeholder="Adult / Junior / Family …" required />
            <datalist id="tier-list">
              <option value="Adult (annual)"></option>
              <option value="Junior (annual)"></option>
              <option value="Family (annual)"></option>
              <option value="Adult (quarterly)"></option>
              <option value="Junior (quarterly)"></option>
              <option value="Family (quarterly)"></option>
              <option value="Adult (monthly)"></option>
              <option value="Junior (monthly)"></option>
              <option value="Day pass"></option>
              <option value="3-day pass"></option>
            </datalist>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="label" for="purchase-date">Purchase date</label>
              <input class="input" id="purchase-date" type="date" required />
            </div>
            <div class="field">
              <label class="label" for="valid-from">Valid from</label>
              <input class="input" id="valid-from" type="date" required />
            </div>
            <div class="field">
              <label class="label" for="valid-until">Valid until</label>
              <input class="input" id="valid-until" type="date" required />
            </div>
          </div>
          <div class="field">
            <label class="label" for="notes">Notes</label>
            <textarea class="textarea" id="notes" placeholder="Optional"></textarea>
          </div>
          <div id="error" class="field-error" hidden></div>
          <div class="btn-row">
            <button class="btn" type="submit" id="submit-btn">Save</button>
            <a class="btn btn-ghost" href="./index.html">Cancel</a>
          </div>
        </form>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-log-membership.js"></script>
  </body>
</html>

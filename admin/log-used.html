<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log lesson used · Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="page page-narrow">
      <div class="page-header">
        <div>
          <h1>Log a lesson used</h1>
          <p>Record a private or group lesson against a student's balance.</p>
        </div>
      </div>

      <div class="card">
        <form id="form" class="form">
          <div class="field">
            <label class="label" for="student-id">Student</label>
            <input
              class="input"
              id="student-id"
              placeholder="Type name or email to search…"
              autocomplete="off"
              required
            />
          </div>
          <div class="field-row">
            <div class="field">
              <label class="label" for="date">Date</label>
              <input class="input" id="date" type="date" required />
            </div>
            <div class="field">
              <label class="label" for="type">Type</label>
              <select class="select" id="type" required>
                <option value="private">Private</option>
                <option value="group">Group</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="label" for="start-time">Start time</label>
              <select class="select" id="start-time" required>
                <option value="">Pick a time…</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="end-time">End time</label>
              <select class="select" id="end-time" required>
                <option value="">Pick a time…</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="hours">Hours</label>
              <input class="input" id="hours" type="number" step="0.5" readonly required />
              <span class="field-help">Auto-calculated from start &amp; end.</span>
            </div>
          </div>
          <div class="field">
            <label class="label" for="coach">Coach</label>
            <input class="input" id="coach" list="coach-list" placeholder="Eric, Anna…" />
            <datalist id="coach-list">
              <option value="Eric"></option>
              <option value="Anna"></option>
              <option value="Other"></option>
            </datalist>
            <span class="field-help">Free-text — any coach name is accepted. The dropdown is just a quick-pick.</span>
          </div>
          <div class="field">
            <label class="label" for="notes">Notes</label>
            <textarea class="textarea" id="notes" placeholder="Optional"></textarea>
          </div>
          <div id="balance-warn" class="banner banner-warn" hidden></div>
          <div id="error" class="field-error" hidden></div>
          <div class="btn-row">
            <button class="btn" type="submit" id="submit-btn">Save</button>
            <a class="btn btn-ghost" href="./index.html">Cancel</a>
          </div>
        </form>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-log-used.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Eric Table Tennis</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <span class="brand-mark">ETT</span>
        <h1>Sign in</h1>
        <p class="auth-sub">Eric Table Tennis member portal</p>
        <form id="login-form" class="form">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input
              class="input"
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div id="error" class="field-error" hidden></div>
          <button class="btn btn-block" type="submit" id="submit-btn">Sign in</button>
        </form>
        <p class="auth-foot">
          New here? <a href="./register.html">Create an account</a>
        </p>
      </div>
    </div>
    <script type="module" src="./js/pages/login.js"></script>
  </body>
</html>
